name: acceptance-test-preprod

on:
  workflow_dispatch:
  # NOTE: deliberately no `pull_request:` trigger. This workflow exports live
  # preprod portal credentials and then builds and runs the checked-out code,
  # so a `pull_request` run would hand those secrets to unreviewed code.
  # Use `workflow_dispatch` to run acceptance on a branch.
  push:
    branches:
      - main
      - dev
      - 'release/*'

concurrency:
  group: acceptance-test-preprod
  # false is deliberate: a live terraform apply/destroy against preprod must run to completion
  # rather than be cancelled mid-flight. Consequence: consecutive pushes queue as separate
  # pending approvals instead of superseding one another. Reviewers should approve the
  # newest queued run and dismiss the rest, or an old run may apply against a stale commit.
  cancel-in-progress: false

jobs:
  acceptance-test-preprod:
    runs-on: ubuntu-latest
    # Gate every path that reaches the preprod portal credentials behind a
    # protected environment with required reviewers. Both a `push` to an
    # unprotected branch (e.g. dev) and a `workflow_dispatch` on an arbitrary
    # ref now pause for reviewer approval before this job runs. The
    # PREPROD_TERRAFORM_* secrets must live in this environment (not at repo
    # scope) so they only resolve inside this approved job.
    environment: acceptance-preprod
    env:
      ALKIRA_PORTAL:   ${{ secrets.PREPROD_TERRAFORM_PORTAL }}
      ALKIRA_USERNAME: ${{ secrets.PREPROD_TERRAFORM_USERNAME }}
      ALKIRA_PASSWORD: ${{ secrets.PREPROD_TERRAFORM_PASSWORD }}
      ALKIRA_CXP:      "US-WEST-1"
      ALKIRA_API_SERIALIZATION_ENABLED:    "true"

    steps:
      -
        name: Pull Terraform CLI
        uses: hashicorp/setup-terraform@v3
      -
        name: Add .terraformrc
        run: echo 'provider_installation {
                    dev_overrides {
                    "alkiranet/alkira" = "/home/runner/work/terraform-provider-alkira/terraform-provider-alkira/bin"
                    }
                    direct {}
                  }' > ~/.terraformrc
      -
        name: Checkout Repo
        uses: actions/checkout@v4
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      -
        name: Build Terraform Provider
        run: |
          cd /home/runner/work/terraform-provider-alkira/terraform-provider-alkira
          make
      -
        name: Run Terraform Apply
        run: |
          cd acceptance
          terraform apply --auto-approve -var cxp=$ALKIRA_CXP
      -
        name: Run Terraform Destroy
        if: ${{ always() }}
        run: |
          cd acceptance
          terraform destroy --auto-approve
